[workspace]
resolver = "3"
members = ["crates/studio-core", "apps/photo-studio", "apps/photo-studio-cli"]
default-members = ["crates/studio-core", "apps/photo-studio", "apps/photo-studio-cli"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"
authors = ["Abhay Pratap Singh <abhaypratap3537@gmail.com>"]
repository = "https://github.com/devops-monk/photo-studio"
homepage = "https://photo-studio.devops-monk.com"
rust-version = "1.88"

[workspace.dependencies]
studio-core = { path = "crates/studio-core" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff", "gif", "tga", "ico", "qoi", "pnm", "rayon", "exr", "hdr"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tiny-skia = "0.11"
ab_glyph = "0.2"
zip = { version = "2", default-features = false, features = ["deflate"] }
psd = "0.3"
resvg = { version = "0.48", default-features = false, features = ["text", "system-fonts", "memmap-fonts"] }
quick-xml = "0.38"

[workspace.lints.rust]
unsafe_code = "forbid"
# Newer clippy lints below are unknown to older toolchains.
unknown_lints = "allow"

[workspace.lints.clippy]
# Pixel loops read clearer with explicit indices, and nested `if`s mirror the UI structure.
collapsible_if = "allow"
collapsible_match = "allow"
needless_range_loop = "allow"
type_complexity = "allow"
large_enum_variant = "allow"
too_many_arguments = "allow"
enum_variant_names = "allow"
new_ret_no_self = "allow"
self_named_constructors = "allow"
# `chunks_exact(4)` is the clearest way to walk RGBA pixels.
chunks_exact_to_as_chunks = "allow"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
